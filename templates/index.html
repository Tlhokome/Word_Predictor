<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Word Predictor | Friends Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Next Word Predictor App</h1>
        
        <form method="POST">
            <div class="form-group">
                <label for="seed_text">Enter your starting phrase:</label>
                <input type="text" id="seed_text" name="seed_text" required 
                       placeholder="E.g I am going to" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="next_words">Words to predict:</label>
                <select id="next_words" name="next_words" required>
                    <option value="1">1 word</option>
                    <option value="2">2 words</option>
                    <option value="3" selected>3 words</option>
                    <option value="4">4 words</option>
                    <option value="5">5 words</option>
                    <option value="6">6 words</option>
                </select>
            </div>
            
            <button type="submit">Predict Next Words</button>
        </form>
        
        {% if prediction %}
        <div class="result">
            <h3>Prediction Result:</h3>
            <p>{{ prediction }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
